h1{font-size:34px;line-height:1.15;font-weight:600;letter-spacing:.02em;

.sub{margin-top:10px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.72);

.cta{margin-top:26px;height:54px;border-radius:27px;display:flex;align-items:center;

@keyframes breathe{0%,100%{transform:translateY(0);box-shadow:0 12px 34px rgba(201,161,91,.30),inset 0 1px 0 rgba(255,255,255,.5)}
  50%{transform:translateY(-2px);box-shadow:0 18px 42px rgba(201,161,91,.48),inset 0 1px 0 rgba(255,255,255,.5)}}
.cta svg{width:17px;height:17px;flex:none}
.hint{margin-top:12px;text-align:center;font-size:11px;letter-spacing:.16em;
  color:rgba(255,255,255,.34)}

/* 微信二维码弹层 */

#wx.on{display:grid}
.box{width:100%;max-width:320px;text-align:center;color:#fff}
.box .t{font-size:15px;color:rgba(255,255,255,.86);margin-bottom:18px;letter-spacing:.02em}
.qwrap{position:relative;width:216px;height:216px;margin:0 auto;border-radius:18px;

.qwrap img{width:100%;height:100%;object-fit:contain;display:block;border-radius:8px}
.qempty{position:absolute;inset:12px;display:none;place-items:center;border-radius:8px;

.wxid{margin-top:18px;font-size:14px;color:rgba(255,255,255,.82)}
.wxid b{color:#eccd94;font-weight:600;letter-spacing:.03em}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;height:46px;border:0;border-radius:23px;font-size:14px;font-weight:600;

#copy{background:linear-gradient(135deg,#eccd94,#c9a15b);color:#1b1206}

  opacity:0;transition:.28s;pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  // ---- 运行时覆盖：不用改文件也能试链接 ----
  // index.html?to=https://t.me/abc        → 改跳转目标
  // index.html?wx=你的微信号&qr=myqr.png   → 临时切微信二维码模式
  // index.html?name=张三&title=CEO         → 临时改名头
  try {
    var q = new URLSearchParams(location.search || '');
    if (q.get('to'))   { CFG.URL = q.get('to');   CFG.TYPE = 'link'; }
    if (q.get('wx'))   { CFG.WXID = q.get('wx');  CFG.TYPE = 'wechat'; }
    if (q.get('qr'))   { CFG.QR = q.get('qr'); }
    if (q.get('name')) { CFG.NAME = q.get('name'); }
    if (q.get('title')){ CFG.TITLE = q.get('title'); }
    if (q.get('sub'))  { CFG.SUB = q.get('sub'); }
  } catch (e) {}

  // ---- 填充文案 ----
  $('name').textContent  = CFG.NAME;
  $('sub').textContent   = CFG.SUB;
  $('kicker').textContent = CFG.TITLE;
  $('ctatext').textContent = CFG.CTA || ((CFG.TYPE === 'wechat') ? '扫码加我微信' : '点我直接聊天');
  $('wxid').textContent = CFG.WXID;
  if (!CFG.WXID) { $('wxrow').style.display = 'none'; $('copy').style.display = 'none'; }
  document.title = CFG.NAME;
  document.querySelector('meta[property="og:title"]').setAttribute('content', CFG.NAME);
  document.querySelector('meta[property="og:description"]').setAttribute('content', CFG.SUB);

  // ---- 微信二维码 ----
  var qi = $('qrimg'), qe = $('qempty');
  qi.onload  = function(){ qe.style.display = 'none'; };
  qi.onerror = function(){ qi.style.display = 'none'; qe.style.display = 'grid'; };
  function loadQR(){ if (!qi.getAttribute('src')) qi.src = CFG.QR; }
  // 首屏不加载二维码：页面渲染完再后台预取，点开时已经就绪（省一次首屏请求）
  if (window.addEventListener){
    window.addEventListener('load', function(){ setTimeout(loadQR, 600); });
  }

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('on'); }, 1600);
  }

  function openWx(){ loadQR(); $('wx').classList.add('on'); }
  function closeWx(){ $('wx').classList.remove('on'); }

  function go(){
    if (CFG.TYPE === 'wechat'){ openWx(); return; }

    if (!CFG.URL || CFG.URL.indexOf('your_id') > -1){
      toast('还没填链接：编辑 index.html 里的 CFG.URL');
      return;
    }
    // 微信内置浏览器打开外部 App scheme 会被拦，https 链接可正常跳
    window.location.href = CFG.URL;
  }

  $('stage').addEventListener('click', go);
  $('close').addEventListener('click', function(e){ e.stopPropagation(); closeWx(); });
  $('wx').addEventListener('click', function(e){ if(e.target === $('wx')) closeWx(); });

  $('copy').addEventListener('click', function(e){
    e.stopPropagation();
    var txt = CFG.WXID, done = function(){ toast('微信号已复制'); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(err){ toast('请手动长按复制'); }
      document.body.removeChild(ta);
    }
  });

  // 微信里 URL 型名片补一句提示
  if (CFG.TYPE !== 'wechat' && /MicroMessenger/i.test(navigator.userAgent)){
    setTimeout(function(){
      var h = document.querySelector('.hint');
      if (h) h.textContent = '如无法跳转，点右上角 ··· 选「在浏览器打开」';
    }, 1200);
  }
})();
</script>
</body>
</html>
